<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생성형 AI — 대화형 챗봇 (시안)</title>
<style>
  :root{
    --page:#e9e9ec; --surface:#ffffff; --side:#171717;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --border:rgba(11,11,11,.10);
    --gpt:#1baf7a; --bad:#d03b3b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#0d0d0d; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo",sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .stage-wrap{transform-origin:center center}
  .stage{
    position:relative; width:960px; height:700px;
    background:var(--page);
    border:1px solid rgba(255,255,255,.10); border-radius:16px;
    padding:18px 26px 14px; overflow:hidden;
  }

  /* ── header ── */
  .hd{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .hd-title{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; letter-spacing:-.2px; color:var(--ink)}
  .old-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .replay{
    font:inherit;font-size:11px;color:var(--ink2);background:var(--surface);
    border:1px solid var(--border);border-radius:999px;padding:5px 13px;cursor:pointer;
    transition:all .25s;
  }
  .replay:hover{border-color:rgba(208,59,59,.45);color:var(--ink)}
  .replay.nudge{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{border-color:rgba(208,59,59,.6);box-shadow:0 0 10px rgba(208,59,59,.18)}}

  /* ── 챗 앱 프레임 ── */
  .app{
    display:flex; height:576px; border-radius:14px; overflow:hidden;
    border:1px solid var(--border); box-shadow:0 8px 30px rgba(0,0,0,.10);
    margin-bottom:12px; background:var(--surface);
  }
  /* 사이드바 */
  .side{width:172px; flex:none; background:var(--side); color:#ececec; padding:12px 10px; display:flex; flex-direction:column; gap:4px}
  .newchat{
    display:flex;align-items:center;gap:6px;
    font-size:11px;color:#ececec;border:1px solid rgba(255,255,255,.2);border-radius:8px;
    padding:7px 10px;margin-bottom:8px;
  }
  .hist{font-size:10.5px;color:#9a9a97;padding:6px 10px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hist.sel{background:rgba(255,255,255,.09);color:#ececec}
  .side-foot{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:10.5px;color:#c9c9c6;padding:6px 8px;border-top:1px solid rgba(255,255,255,.12)}
  .avatar-u{width:20px;height:20px;border-radius:50%;background:#5b5bd6;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* 메인 채팅 */
  .main{flex:1; display:flex; flex-direction:column; background:var(--surface)}
  .model{font-size:11.5px;color:var(--muted);font-weight:600;padding:12px 18px 8px}
  .chat{flex:1; padding:6px 26px 8px; overflow:hidden; display:flex; flex-direction:column; gap:14px}

  .msg-u{
    align-self:flex-end; max-width:70%;
    background:#f0f0f2; border-radius:16px 16px 4px 16px;
    padding:10px 14px; font-size:13px; color:var(--ink);
    opacity:0; transform:translateY(8px); transition:all .35s;
  }
  .msg-u.in{opacity:1; transform:none}

  .msg-a{display:flex; gap:10px; opacity:0; transition:opacity .3s}
  .msg-a.in{opacity:1}
  .avatar-a{
    width:28px;height:28px;border-radius:50%;flex:none;
    background:var(--gpt);color:#fff;font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .a-body{flex:1; font-size:13px; line-height:1.75; color:var(--ink); white-space:pre-wrap; padding-top:3px}
  .a-body .cur{display:inline-block;width:8px;height:14px;background:var(--ink);vertical-align:-2px;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .think{display:flex;gap:4px;padding-top:9px}
  .think i{width:7px;height:7px;border-radius:50%;background:#b6b6b3;animation:th 1s infinite}
  .think i:nth-child(2){animation-delay:.18s}
  .think i:nth-child(3){animation-delay:.36s}
  @keyframes th{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  /* 결말 카드 */
  .note{
    align-self:center; display:flex; align-items:center; gap:10px;
    background:#fdf3f3; border:1px solid rgba(208,59,59,.35); border-radius:10px;
    padding:9px 14px; font-size:11.5px; color:var(--ink2);
    opacity:0; transform:translateY(8px); transition:all .4s;
  }
  .note.in{opacity:1; transform:none}
  .note b{color:var(--bad); font-weight:800}
  .note .nbadge{
    font-size:10px;font-weight:800;color:#fff;background:var(--bad);
    border-radius:999px;padding:3px 9px;flex:none;
  }

  /* 입력창 */
  .inputbar{padding:10px 26px 16px}
  .inputbox{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--border);border-radius:999px;
    padding:11px 8px 11px 18px; font-size:13px; color:var(--ink);
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  .inputbox .ph{color:#b0b0ad}
  .inputbox .typed{white-space:nowrap;overflow:hidden}
  .caret{display:inline-block;width:7px;height:15px;background:var(--ink2);animation:blink 1s infinite;vertical-align:-2px}
  .caret.off{display:none}
  .sendbtn{
    margin-left:auto;width:30px;height:30px;border-radius:50%;flex:none;
    background:#d7d7db;color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:14px;transition:background .25s;
  }
  .sendbtn.ready{background:var(--ink)}
  .sendbtn.flash{background:var(--gpt)}

  /* ── 시작 오버레이 ── */
  .playov{
    position:absolute;inset:0;z-index:20;border-radius:16px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(233,233,236,.66);backdrop-filter:blur(3px);
    transition:opacity .4s;
  }
  .playov.off{opacity:0;pointer-events:none}
  .playbtn{
    width:76px;height:76px;border-radius:50%;
    border:2px solid var(--gpt);color:var(--gpt);
    background:rgba(27,175,122,.10);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;padding-left:6px;transition:transform .2s;
  }
  .playov:hover .playbtn{transform:scale(1.08)}
  .playtxt{font-size:13px;color:var(--ink2);letter-spacing:.06em}

  /* ── 단계 표시 ── */
  .steps{display:flex;align-items:center;justify-content:center;gap:7px}
  .chip{
    display:flex;align-items:center;gap:5px;
    font-size:10px;color:var(--muted);
    border:1px solid var(--border);border-radius:999px;padding:4px 11px;
    background:var(--surface);transition:all .3s;
  }
  .chip b{font-weight:800;font-size:9px;width:13px;height:13px;border-radius:50%;
    background:#e2e2e5;color:var(--ink2);display:flex;align-items:center;justify-content:center}
  .chip.act{color:var(--ink);border-color:rgba(11,11,11,.3)}
  .chip.act b{background:var(--ink);color:#fff}
  .chip.fin{color:var(--ink2)}
  .chip.fin b{background:#b6b6b3;color:#fff}
  .chip.bad{color:var(--bad);border-color:rgba(208,59,59,.5);background:#fdf3f3}
  .chip.bad b{background:var(--bad);color:#fff}
  .sdash{width:14px;height:1px;background:#d0d0d3}
</style>
</head>
<body>
<div class="stage-wrap" id="wrap">
<div class="stage" id="stage">

  <div class="hd">
    <div class="hd-title"><span class="old-dot"></span>생성형 AI — 대화형 챗봇 (기존 방식)<span style="font-size:11.5px;font-weight:500;color:var(--muted);margin-left:6px">챗GPT · 제미나이 · 클로드AI</span></div>
    <button class="replay" id="replayBtn">↻ 다시 재생</button>
  </div>

  <div class="app">
    <div class="side">
      <div class="newchat">＋ 새 채팅</div>
      <div class="hist sel">엑셀 정리 부탁</div>
      <div class="hist">회의록 요약해줘</div>
      <div class="hist">이메일 영어로 번역</div>
      <div class="hist">보고서 초안 아이디어</div>
      <div class="hist">점심 메뉴 추천</div>
      <div class="side-foot"><span class="avatar-u">A</span>회사원 A</div>
    </div>
    <div class="main">
      <div class="model">챗봇 4o ▾</div>
      <div class="chat">
        <div class="msg-u" id="msgU"></div>
        <div class="msg-a" id="msgA">
          <div class="avatar-a">✦</div>
          <div class="a-body" id="aBody"></div>
        </div>
        <div class="note" id="note">
          <span class="nbadge">결과물 없음</span>
          <span>안내문만 도착 — 엑셀 23개는 여전히 폴더에 그대로. <b>열고, 세고, 정리하는 건 결국 내 몫</b></span>
        </div>
      </div>
      <div class="inputbar">
        <div class="inputbox">
          <span class="typed" id="typed"><span class="ph" id="ph">무엇이든 물어보세요...</span></span><span class="caret" id="caret"></span>
          <div class="sendbtn" id="sendBtn">↑</div>
        </div>
      </div>
    </div>
  </div>

  <div class="steps" id="steps">
    <div class="chip"><b>1</b>질문</div><div class="sdash"></div>
    <div class="chip"><b>2</b>답변 생성</div><div class="sdash"></div>
    <div class="chip"><b>3</b>안내문 수령</div><div class="sdash"></div>
    <div class="chip"><b>4</b>실행은 내가</div>
  </div>

  <div class="playov" id="playov"><div class="playbtn">▶</div><div class="playtxt">클릭하면 시작</div></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const wrap=$('wrap');
const CMD='다운로드 폴더 엑셀 전부 확인해서 품목별 개수 정리해줘';
const ANSWER=`직접 파일에 접근할 수는 없지만, 방법을 알려드릴게요! 😊

1. 다운로드 폴더를 열고 엑셀 파일들을 확인하세요
2. 각 파일을 열어 품목이 있는 열을 찾으세요
3. 삽입 → 피벗 테이블에서 품목별 개수를 집계하세요
4. 집계 결과를 새 통합 문서에 복사하세요
5. 나머지 파일 22개도 같은 과정을 반복하세요

정리가 끝나면 저장을 잊지 마세요. 더 궁금한 점이 있으면 말씀해주세요!`;
let timers=[];

function fit(){
  const k=Math.min((innerWidth-24)/960,(innerHeight-24)/700);
  wrap.style.transform=`scale(${k})`;
}
addEventListener('resize',fit);

function at(ms,fn){timers.push(setTimeout(fn,ms))}
function step(n,st){
  $('steps').querySelectorAll('.chip').forEach((c,i)=>{
    if(i<n-1)c.className='chip fin';
    else if(i===n-1)c.className='chip '+st;
    else c.className='chip';
  });
}

function reset(){
  $('ph').style.display='';
  $('typed').querySelectorAll('.t').forEach(e=>e.remove());
  $('caret').classList.remove('off');
  $('sendBtn').className='sendbtn';
  $('msgU').textContent=''; $('msgU').classList.remove('in');
  $('msgA').classList.remove('in');
  $('aBody').innerHTML='';
  $('note').classList.remove('in');
  step(1,'act');
}

function run(){
  timers.forEach(clearTimeout); timers=[];
  $('replayBtn').classList.remove('nudge');
  reset();

  /* 1. 입력창 타이핑 */
  const typedEl=$('typed');
  CMD.split('').forEach((ch,i)=>at(400+i*80,()=>{
    if(i===0){$('ph').style.display='none';$('sendBtn').classList.add('ready')}
    const s=document.createElement('span'); s.className='t'; s.textContent=ch;
    typedEl.appendChild(s);
  }));
  const typed=400+CMD.length*80;

  /* 전송 */
  at(typed+300,()=>{
    $('sendBtn').classList.add('flash');
    $('caret').classList.add('off');
    typedEl.querySelectorAll('.t').forEach(e=>e.remove());
    $('ph').style.display='';
    $('msgU').textContent=CMD;
    $('msgU').classList.add('in');
    step(2,'act');
  });

  /* 2. 생각 중 */
  at(typed+800,()=>{
    $('sendBtn').className='sendbtn';
    $('msgA').classList.add('in');
    $('aBody').innerHTML='<span class="think"><i></i><i></i><i></i></span>';
  });

  /* 3. 답변 스트리밍 */
  const stream=typed+2100;
  at(stream,()=>{
    $('aBody').innerHTML='<span id="atext"></span><span class="cur"></span>';
  });
  ANSWER.split('').forEach((ch,i)=>at(stream+i*16,()=>{
    const t=document.getElementById('atext'); if(t)t.textContent+=ch;
  }));
  const streamEnd=stream+ANSWER.length*16;
  at(streamEnd+200,()=>{
    const c=$('aBody').querySelector('.cur'); if(c)c.remove();
    step(3,'act');
  });

  /* 4. 결말 — 실행은 내가 */
  at(streamEnd+1100,()=>{
    $('note').classList.add('in');
    step(4,'bad');
  });
  at(streamEnd+2600,()=>$('replayBtn').classList.add('nudge'));
}

$('replayBtn').addEventListener('click',run);
$('playov').addEventListener('click',()=>{$('playov').classList.add('off');run()});

/* 덱(iframe) 안에서 방향키·스페이스를 부모로 전달 */
if(parent!==window){
  document.body.style.background='transparent';
  document.addEventListener('keydown',e=>{
    if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','PageUp','PageDown',' '].includes(e.key)){
      e.preventDefault(); parent.postMessage({deckKey:e.key},'*');
    }
  });
}

fit(); reset();
</script>
</body>
</html>
